<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="黄石之旅行程：盐湖城 → 大提顿 → 黄石 → HYROX 盐湖城 → 洛杉矶，2026年9月13日 – 20日。" />
  <title>黄石之旅 2026 · 行程</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
/* East Coast 2026 itinerary - styling */
:root {
  --bg: #0f1424;
  --bg-soft: #171d33;
  --card: #1d2440;
  --card-2: #232c4f;
  --ink: #eef1fb;
  --muted: #a4adcf;
  --line: #2c355c;
  --accent: #5b8cff;
  --accent-2: #ff5d73;
  --gold: #f5c451;
  --green: #36d399;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --radius: 16px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(1200px 600px at 80% -10%, #21306b 0%, transparent 60%), var(--bg);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 960px; margin: 0 auto; padding: 0 18px 80px; }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  padding: 56px 18px 30px;
  text-align: center;
  background:
    radial-gradient(800px 300px at 50% -40%, rgba(91,140,255,.35), transparent 70%);
}

/* Language switch (EN / 中文) */
.lang-switch {
  position: absolute; top: 14px; right: 14px; z-index: 30;
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  box-shadow: var(--shadow);
}
.lang-switch button {
  background: transparent; color: var(--muted); border: none; cursor: pointer;
  font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; line-height: 1;
}
.lang-switch button.active { background: var(--accent); color: #fff; }
.lang-switch button:hover:not(.active) { color: var(--ink); }

/* Trip switch (link to the other trip page: East Coast <-> Yellowstone) */
.trip-switch {
  position: absolute; top: 14px; left: 14px; z-index: 30;
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  box-shadow: var(--shadow); color: var(--muted); font-size: 13px; font-weight: 700;
  text-decoration: none; line-height: 1;
}
.trip-switch:hover { color: var(--ink); }
.hero .flag { font-size: 40px; letter-spacing: 4px; }
.hero h1 { font-size: clamp(28px, 6vw, 52px); margin: 8px 0 6px; line-height: 1.05; }
.hero .route { color: var(--gold); font-weight: 700; font-size: clamp(15px, 3.4vw, 22px); }
.hero .dates { color: var(--muted); margin-top: 6px; font-size: 15px; }

/* Countdown */
.countdown { display: flex; gap: 10px; justify-content: center; margin: 22px 0 6px; flex-wrap: wrap; }
.cd-box {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 16px; min-width: 78px; box-shadow: var(--shadow);
}
.cd-box .num { font-size: 26px; font-weight: 800; color: var(--accent); }
.cd-box .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.cd-msg { color: var(--gold); font-weight: 700; margin-top: 6px; }

/* ---------- Nav ---------- */
nav.tabs {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: 6px; overflow-x: auto; padding: 10px;
  background: rgba(15,20,36,.85); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
nav.tabs button {
  flex: 0 0 auto; background: transparent; color: var(--muted);
  border: 1px solid transparent; border-radius: 999px; padding: 8px 16px;
  font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button.active { color: #fff; background: var(--accent); }

/* ---------- Sections / cards ---------- */
section { display: none; padding-top: 26px; }
section.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

h2.sec-title { font-size: 24px; margin: 6px 0 4px; }
p.sec-sub { color: var(--muted); margin: 0 0 18px; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; margin: 14px 0; box-shadow: var(--shadow);
}

/* Highlights */
.highlight { display: flex; gap: 12px; align-items: flex-start; }
.highlight + .highlight { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }

.city-chips { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0 0; }
.chip {
  background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; flex: 1 1 180px;
}
.chip .city { font-weight: 800; font-size: 17px; }
.chip .meta { color: var(--muted); font-size: 13px; }

/* ---------- Itinerary day ---------- */
.day { margin: 16px 0; }
.day-head {
  display: flex; align-items: center; gap: 14px; cursor: pointer;
  padding: 16px 18px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.day-head:hover { border-color: var(--accent); }
.day-num {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #3b63c9);
  display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff;
}
.day-head .dh-main { flex: 1; min-width: 0; }
.day-head .dh-date { font-size: 12px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
.day-head .dh-title { font-weight: 700; font-size: 16px; }
.day-head .dh-city { font-size: 12px; color: var(--muted); }
.day-head .caret { color: var(--muted); transition: transform .2s; }
.day.open .day-head .caret { transform: rotate(90deg); }

.day-body { display: none; padding: 4px 6px 6px; }
.day.open .day-body { display: block; }

.block { display: flex; gap: 14px; padding: 14px 4px; border-bottom: 1px dashed var(--line); }
.block:last-of-type { border-bottom: none; }
.block .when {
  flex: 0 0 86px; font-weight: 800; font-size: 12px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--accent); padding-top: 2px;
}
.block .what { flex: 1; }
.block .what .bt { font-weight: 700; }
.block .what .bd { color: var(--muted); font-size: 14px; margin-top: 2px; }
.map-link {
  display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600;
  background: var(--card-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 4px 10px;
}

.eat, .tips { margin-top: 12px; font-size: 14px; }
.eat { color: var(--ink); }
.tips ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }

.decision {
  background: linear-gradient(180deg, rgba(245,196,81,.12), rgba(245,196,81,.04));
  border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin: 10px 0 14px;
}
.decision .dt { font-weight: 800; color: var(--gold); }
.decision ol { margin: 8px 0 0; padding-left: 18px; }
.decision li { margin: 4px 0; }

/* ---------- Tables ---------- */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 800; border-top: 2px solid var(--accent); border-bottom: none; font-size: 15px; }

/* ---------- Weather ---------- */
.wx-list { margin-top: 6px; }
.wx-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 4px; border-bottom: 1px solid var(--line);
}
.wx-row:last-child { border-bottom: none; }
.wx-emoji { font-size: 30px; flex: 0 0 auto; width: 40px; text-align: center; }
.wx-main { flex: 1; min-width: 0; }
.wx-date { font-weight: 700; font-size: 14px; }
.wx-cond { color: var(--muted); font-size: 13px; margin-top: 2px; }
.wx-tag {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  background: var(--card-2); color: var(--muted); border: 1px solid var(--line); margin-left: 4px;
}
.wx-tag.live { background: rgba(54,211,153,.15); color: var(--green); border-color: var(--green); }
.wx-temps { flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wx-hi { font-weight: 800; font-size: 17px; }
.wx-lo { color: var(--muted); font-size: 15px; margin-left: 6px; }
.wx-rain { color: var(--accent); font-size: 12px; margin-left: 8px; }
.wx-updated { color: var(--muted); font-size: 12px; margin-top: 12px; }
.wx-status { color: var(--muted); font-size: 12px; margin-top: 4px; min-height: 1em; }
.wx-advice { margin: 6px 0 0; padding-left: 20px; }
.wx-advice li { margin: 6px 0; font-size: 14px; }

/* Small weather chip in each itinerary day header */
.wx-badge {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
  padding: 2px 9px; border-radius: 999px; font-size: 12px;
  background: var(--card-2); border: 1px solid var(--line); color: var(--muted);
}
.wx-badge.live { border-color: var(--green); }
.wxb-emoji { font-size: 14px; }
.wxb-temp { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.wxb-rain { color: var(--accent); }

/* ---------- Checklists ---------- */
.check { display: flex; align-items: flex-start; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.check:last-child { border-bottom: none; }
.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--green); flex: 0 0 auto; }
.check.done span { color: var(--muted); text-decoration: line-through; }
.pack-group h3 { margin: 16px 0 2px; font-size: 15px; color: var(--gold); }
.reset-btn {
  background: transparent; color: var(--muted); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; margin-top: 10px;
}
.reset-btn:hover { color: var(--ink); border-color: var(--accent); }
.progress { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }

/* ---------- Per-day map ---------- */
.daymap {
  margin: 14px 4px 4px; padding: 14px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--card-2);
}
.daymap-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.daymap-title { font-weight: 800; font-size: 14px; }
.daymap-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.route-btn {
  background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 12px;
  font-size: 13px; font-weight: 700; white-space: nowrap;
}
.route-btn:hover { text-decoration: none; filter: brightness(1.08); }
.route-btn.nav-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.route-btn.nav-btn:hover { background: rgba(91,140,255,.12); filter: none; }
.daymap-legend { margin: 10px 0 12px; padding-left: 26px; }
.daymap-legend li { margin: 3px 0; font-size: 14px; }
.daymap-legend .leg { color: var(--muted); font-size: 12px; }
.leaflet-day { height: 300px; width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.leaflet-day .leaflet-container { background: #aad3df; }
.pin-icon { background: transparent; border: none; }
.pin {
  width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  background: var(--accent); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4);
  display: grid; place-items: center;
}
.pin > span { transform: rotate(45deg); color: #fff; font-weight: 800; font-size: 13px; }

.food-list { margin: 6px 0 0; padding-left: 20px; }
.food-list li { margin: 7px 0; font-size: 14.5px; line-height: 1.55; color: var(--ink); }

footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0 0; }

@media (max-width: 560px) {
  .block { flex-direction: column; gap: 4px; }
  .block .when { flex-basis: auto; }
  .day-head { padding: 12px; }
}

@media print {
  nav.tabs, .countdown, .reset-btn, .leaflet-day, .lang-switch { display: none !important; }
  section { display: block !important; page-break-inside: avoid; }
  body { background: #fff; color: #000; }
  .card, .day-head { box-shadow: none; }
}

</style>
</head>

  <nav class="tabs">

  <script>
/*

 *
 * Same schema as data.js (East Coast). English here is the SOURCE OF TRUTH;

const TRIP = {
  storeKey: "ys2026", // separate checklist storage from the East Coast trip (language choice is shared)
  title: "Yellowstone 2026",
  subtitle: "Salt Lake City → Grand Teton → Yellowstone → HYROX SLC → LAX",
  startDate: "2026-09-13", // Sunday

  // Big-picture context worth knowing before you go.
  highlights: [

    "🛣 Four park days, each on its own arm of the figure-8, so you rarely drive the same road twice: geyser basins south of Madison (Sep 15), Norris + Canyon + Hayden to the east (Sep 16), Mammoth + Tower + Lamar in the north (Sep 17), and a short local day near town (Sep 18). Every ‘extra’ sight sits on a road you already have to drive.",
    "🧥 Mid-September Yellowstone: days 55–65°F, mornings 25–35°F, snow possible any day at 6,600–8,900 ft. Fleece + shell + beanie every morning; strong sun at altitude.",
    "🛣 All park roads are open, but two bridge projects sit on your routes: the Madison River Bridge between the West Entrance and Madison Junction (up to 15-min delays, through Nov 1) — that’s your commute EVERY day, both ways — and the Yellowstone River Bridge at Tower Junction on the NE Entrance road (up to 30-min delays), which is your Sep 17 Lamar day. Add the buffer and check the live road status each morning.",
    "🔥 There is fire activity in the region: main roads in both parks are open, but some local areas and trails are closed and afternoons can go hazy with smoke. Check the NPS road/closure pages before each driving day, and AirNow if the haze looks heavy.",
    "🏋️ It’s HYROX taper week: Yellowstone is active recovery (boardwalks, one short hike), not training — and there are no predawn starts: every day leaves around 9:30–10am and wildlife is scheduled at sunset instead. The hard work is done; carb-loading starts Sep 17.",

  ],

  cities: [
    { name: "Salt Lake City", nights: 2, dates: "Sep 13 & Sep 19" },
    { name: "Grand Teton", nights: 0, dates: "Sep 14 (afternoon)" },
    { name: "West Yellowstone", nights: 5, dates: "Sep 14–19" }
  ],

  // ---- Where you're staying ----
  stays: [
    { hotel: "Hyatt Place Salt Lake City / Downtown / The Gateway", city: "Salt Lake City", dates: "Sep 13 & Sep 19", nights: 2, area: "55 N 400 W, at The Gateway — ~15 min from the airport, and a ~0.5 mi (10-min) walk to the Salt Palace, so race morning needs no car or Uber. Free hot breakfast (weekdays 6:30–9:00, later at weekends) and a mini-fridge in the room." },
    { hotel: "Dude & Roundup Motel, West Yellowstone", city: "West Yellowstone", dates: "Sep 14–19", nights: 5, area: "3 Madison Ave, Double Deluxe room with multiple beds — ONE BLOCK from Yellowstone’s West Entrance, so every park day starts immediately (14 mi to Madison Junction) and the after-dark drives home end fast. No kitchen, but the motel is providing a FRIDGE and MICROWAVE (confirmed by phone); add the rice cooker for rice and congee and you have a workable little kitchen. Starlink Mini works from the parking lot." }
  ],

  // ---- Day-by-day itinerary ----
  // Each block's "map" key is looked up in PLACES for the day map + Google Maps links.
  days: [
    {
      date: "2026-09-13",
      city: "Salt Lake City",
      title: "Fly to Salt Lake City · Night car pickup & supply run",
      summary: "Travel day. Land in the evening, grab the rental car, then a one-stop-shop night northbound: Chinese groceries for the week at Chinatown Supermarket (open till 10pm Sunday), then an electric rice cooker and warm layers — with the motel’s fridge and microwave, that cooker completes a workable little kitchen.",
      blocks: [
        { time: "Evening", title: "✈️ Land at SLC → pick up the rental car", detail: "Rental counters are in the terminal / Rental Car Center. Note the mileage — you return the car Sep 19 afternoon. Check the trunk fits a week of food plus gear.", map: "Salt Lake City International Airport" },
        { time: "~8:00 PM", title: "🛒 Chinatown Supermarket — groceries for the week", detail: "3390 S State St (Sunday hours till 10pm, ~20 min from the airport). You’ll have a fridge, a microwave and a rice cooker, so shop properly: rice, congee fixings, noodles, mantou/baozi (race-week carbs), frozen dumplings, eggs, pre-cooked or braised meats, tofu, leafy greens, sauces, bananas and honey. A cooler bag is still worth it for the long park days.", map: "Chinatown Supermarket Salt Lake City" },
        { time: "~9:00 PM", title: "🍳 Target / Walmart — rice cooker & warm layers", detail: "The one thing worth buying: an ELECTRIC RICE COOKER. The motel’s microwave reheats and steams, but only the cooker does proper rice and congee — and congee in a thermos is what makes the sunset wildlife sessions pleasant. Plus bowls, chopsticks, utensils, a small knife + cutting board, a thermos, dish soap + sponge, and fleece / beanie / gloves — Yellowstone mornings are near freezing. Skip pots and pans; there’s no stove. Most stores close 10–11pm, so this is the last stop.", map: "Target Salt Lake City Central" },
        { time: "Night", title: "🏨 Check in: Hyatt Place Downtown / The Gateway", detail: "55 N 400 W. No rush tomorrow — you leave at 10, and the free hot breakfast runs 6:30–9:00 on weekdays, so eat here before the errands. Charge everything.", map: "Hyatt Place Salt Lake City Downtown" }

        { time: "~9:00 AM", title: "📦 Whole Foods — package pickup", detail: "Eat the free hotel breakfast first (6:30–9:00 on weekdays), then grab the package at the customer-service / Amazon counter.", map: "Whole Foods Market Salt Lake City" },

 */

    const R = 6371, toR = (x) => (x * Math.PI) / 180;

  let T = TRIP;          // active (possibly merged) trip data
  let UI = UICOPY.zh;    // active UI dictionary

  const locale = () => (LANG === "zh" ? "zh-CN" : "en-US");
  const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString(locale(), { weekday: "long", month: "long", day: "numeric" });
  const fmtShort = (iso) => new Date(iso + "T00:00:00").toLocaleDateString(locale(), { weekday: "short", month: "short", day: "numeric" });

  // Deep-merge an English base with a Chinese overlay, falling back to English
  // for any missing/empty field. English is always the structural source.
  function deepMerge(en, zh) {
    if (zh === undefined || zh === null) return en;
    if (Array.isArray(en)) {
      if (!Array.isArray(zh)) return en;
      return en.map((item, i) => deepMerge(item, zh[i]));
    }
    if (en && typeof en === "object") {
      const out = {};
      for (const k in en) out[k] = deepMerge(en[k], zh[k]);
      return out;
    }
    if (typeof en === "string") return (typeof zh === "string" && zh.trim() !== "") ? zh : en;
    return zh !== undefined ? zh : en;
  }

  // Localize an English city name (e.g. day.city, weather city) by reusing the
  // already-translated `cities` array, so it never falls back to English.
  function cityLabel(enCity) {
    if (typeof TRIP === "undefined" || !TRIP.cities) return enCity;
    const idx = TRIP.cities.findIndex((c) => c.name === enCity);
    return (idx >= 0 && T.cities && T.cities[idx]) ? T.cities[idx].name : enCity;
  }

  // persist=true records an explicit user choice; auto-detected values are not
  // saved, so detection keeps running each visit until the user picks via the toggle.
  function applyLang(lang, persist) {
    LANG = lang === "zh" ? "zh" : "en";
    if (persist) localStorage.setItem("ec2026_lang", LANG);
    UI = UICOPY[LANG];
    T = (LANG === "zh" && typeof TRIP_ZH !== "undefined") ? deepMerge(TRIP, TRIP_ZH) : TRIP;
  }

  // Leaflet map instances per day index, lazily initialized when a day opens.
  const dayMapRecs = [];

  // --- overview ---
  function renderOverview() {
    const root = $("#overview");
    root.innerHTML = "";

    const hl = el("div", { class: "card" });
    hl.appendChild(el("h2", { class: "sec-title" }, esc(UI.ov_glance)));
    T.highlights.forEach((h) => hl.appendChild(el("div", { class: "highlight" }, `<div>${esc(h)}</div>`)));
    root.appendChild(hl);

    const cityCard = el("div", { class: "card" });
    cityCard.appendChild(el("h2", { class: "sec-title" }, esc(UI.ov_where)));
    const chips = el("div", { class: "city-chips" });
    T.cities.forEach((c) => {
      chips.appendChild(el("div", { class: "chip" },
        `<div class="city">${esc(c.name)}</div><div class="meta">${esc(c.dates)}${c.nights > 0 ? " · " + c.nights + " " + esc(c.nights > 1 ? UI.nights : UI.night) : ""}</div>`));
    });
    cityCard.appendChild(chips);
    root.appendChild(cityCard);

    const logi = el("div", { class: "card" });
    logi.appendChild(el("h2", { class: "sec-title" }, esc(UI.ov_logistics)));
    T.logistics.forEach((l) => {
      logi.appendChild(el("div", { class: "highlight" },
        `<div><strong>${esc(l.label)}:</strong> <span style="color:var(--muted)">${esc(l.value)}</span></div>`));
    });
    root.appendChild(logi);
  }

  // --- stays ---
  function renderStays() {
    const root = $("#stays");
    root.innerHTML = "";
    if (!T.stays) return;
    const card = el("div", { class: "card" });
    card.appendChild(el("h2", { class: "sec-title" }, esc(UI.stays_title)));
    card.appendChild(el("p", { class: "sec-sub" }, esc(UI.stays_sub)));
    T.stays.forEach((s) => {
      const row = el("div", { class: "highlight" });
      row.innerHTML =
        `<div>
           <div style="font-weight:700">🏨 <a href="${mapUrl(s.hotel + " " + s.city)}" target="_blank" rel="noopener">${esc(s.hotel)}</a></div>
           <div style="color:var(--gold);font-size:13px">${esc(s.dates)} · ${s.nights} ${esc(s.nights > 1 ? UI.nights : UI.night)} · ${esc(s.city)}</div>
           <div style="color:var(--muted);font-size:14px;margin-top:2px">${esc(s.area)}</div>
         </div>`;
      card.appendChild(row);
    });
    root.appendChild(card);
  }

  // --- per-day map ---
  // A short label for a stop, derived from its block title (strip dash-suffix + lead markers).
  const stopLabel = (title) => title.replace(/\s*—.*$/, "").replace(/^[✅⚠️]\s*/, "");

  function dayStops(d) {
    const seen = new Set();
    let stops = [];
    d.blocks.forEach((b) => {
      if (!b.map || seen.has(b.map) || !PLACES[b.map]) return;
      seen.add(b.map);
      stops.push({ label: stopLabel(b.title), query: b.map, coord: PLACES[b.map] });
    });
    // Drop cross-city outliers (e.g. the DC departure point on the NYC arrival
    // day) so each day's map stays focused on that day's city. Uses the median
    // point as the anchor, then keeps stops within ~1.2° (~80 mi).
    // Days flagged `multiCity` (e.g. the DC→Baltimore→Philly→NYC drive) keep
    // every stop so the road-trip route renders end to end.
    if (stops.length > 2 && !d.multiCity) {
      const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
      const mlat = median(stops.map((s) => s.coord[0]));
      const mlng = median(stops.map((s) => s.coord[1]));
      const near = stops.filter((s) => Math.abs(s.coord[0] - mlat) < 1.2 && Math.abs(s.coord[1] - mlng) < 1.2);
      if (near.length >= 2) stops = near;
    }
    return stops;
  }

  function googleRouteUrl(stops) {
    if (stops.length < 2) return mapUrl(stops[0].query);
    const pts = stops.map((s) => s.coord[0] + "," + s.coord[1]);
    return "https://www.google.com/maps/dir/?api=1&travelmode=walking" +
      "&origin=" + encodeURIComponent(pts[0]) +
      "&destination=" + encodeURIComponent(pts[pts.length - 1]) +
      (pts.length > 2 ? "&waypoints=" + encodeURIComponent(pts.slice(1, -1).join("|")) : "");
  }

  function initLeafletMap(container, stops) {
    if (!window.L || !stops.length) return null;
    const map = L.map(container, { scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap", maxZoom: 19
    }).addTo(map);

    const latlngs = [];
    stops.forEach((s, i) => {
      latlngs.push(s.coord);
      const icon = L.divIcon({
        className: "pin-icon",
        html: `<div class="pin"><span>${i + 1}</span></div>`,
        iconSize: [28, 28], iconAnchor: [14, 26]
      });
      L.marker(s.coord, { icon })
        .addTo(map)
        .bindPopup(`<strong>${i + 1}. ${esc(s.label)}</strong><br><a href="${mapUrl(s.query)}" target="_blank" rel="noopener">${esc(UI.openGoogleMaps)}</a>`);
    });
    if (latlngs.length > 1) {
      L.polyline(latlngs, { color: "#5b8cff", weight: 3, opacity: 0.7, dashArray: "6 6" }).addTo(map);
      map.fitBounds(latlngs, { padding: [34, 34] });
    } else {
      map.setView(latlngs[0], 14);
    }
    return map;
  }

  function renderDayMap(body, d, idx) {
    const stops = dayStops(d);
    if (stops.length < 1) return;

    const wrap = el("div", { class: "daymap" });
    const header = el("div", { class: "daymap-head" });
    header.appendChild(el("div", { class: "daymap-title" }, esc(UI.daymap_places)));
    const btns = el("div", { class: "daymap-btns" });
    // One-tap navigation to the day's first stop (from the user's current location)
    btns.appendChild(el("a", {
      class: "route-btn nav-btn",
      href: "https://www.google.com/maps/dir/?api=1&destination=" + stops[0].coord[0] + "," + stops[0].coord[1],
      target: "_blank", rel: "noopener"
    }, esc(UI.daymap_nav)));
    if (stops.length >= 2) {
      btns.appendChild(el("a", {
        class: "route-btn", href: googleRouteUrl(stops), target: "_blank", rel: "noopener"
      }, esc(UI.daymap_route)));
    }
    header.appendChild(btns);
    wrap.appendChild(header);

    const legend = el("ol", { class: "daymap-legend" });
    stops.forEach((s, i) => {
      let extra = "";
      if (i > 0) {
        const mi = kmBetween(stops[i - 1].coord, s.coord) * 0.621371;
        extra = ` <span class="leg">· ${mi < 0.1 ? esc(UI.leg_nextdoor) : esc(UI.leg_from(i, mi.toFixed(1)))}</span>`;
      }
      const li = el("li", {});
      li.innerHTML = `<a href="${mapUrl(s.query)}" target="_blank" rel="noopener">${esc(s.label)}</a>${extra}`;
      legend.appendChild(li);
    });
    wrap.appendChild(legend);

    const mapDiv = el("div", { class: "leaflet-day", id: "map-day-" + idx });
    wrap.appendChild(mapDiv);
    body.appendChild(wrap);

    dayMapRecs[idx] = { mapDiv, stops, map: null };
  }

  function ensureDayMap(idx) {
    const rec = dayMapRecs[idx];
    if (!rec || rec.map) return;
    rec.map = initLeafletMap(rec.mapDiv, rec.stops);
    if (rec.map) setTimeout(() => rec.map.invalidateSize(), 60);
  }

  // --- itinerary ---
  function renderItinerary() {
    const root = $("#itinerary");
    root.innerHTML = "";
    root.appendChild(el("h2", { class: "sec-title" }, esc(UI.itin_title)));
    root.appendChild(el("p", { class: "sec-sub" }, esc(UI.itin_sub)));

    T.days.forEach((d, i) => {
      const day = el("div", { class: "day" + (i === 0 ? " open" : "") });

      const head = el("div", { class: "day-head", dataset: { date: d.date } });
      head.appendChild(el("div", { class: "day-num" }, String(i + 1)));
      const dhMain = el("div", { class: "dh-main" },
        `<div class="dh-date">${esc(fmtDate(d.date))}</div>
         <div class="dh-title">${esc(d.title)}</div>
         <div class="dh-city">📍 ${esc(cityLabel(d.city))}</div>`);
      const badge = wxBadge(d.date); // small weather chip, synced with the Weather tab
      if (badge) dhMain.appendChild(badge);
      head.appendChild(dhMain);
      head.appendChild(el("div", { class: "caret" }, "▶"));
      head.addEventListener("click", () => {
        day.classList.toggle("open");
        if (day.classList.contains("open")) ensureDayMap(i);
      });
      day.appendChild(head);

      const body = el("div", { class: "day-body" });
      if (d.summary) body.appendChild(el("p", { class: "sec-sub" }, esc(d.summary)));

      if (d.decision) {
        const dec = el("div", { class: "decision" });
        dec.appendChild(el("div", { class: "dt" }, esc(d.decision.title)));
        dec.appendChild(el("div", {}, esc(d.decision.body)));
        const ol = el("ol");
        d.decision.options.forEach((o) => ol.appendChild(el("li", {}, esc(o))));
        dec.appendChild(ol);
        body.appendChild(dec);
      }

      d.blocks.forEach((b) => {
        const blk = el("div", { class: "block" });
        blk.appendChild(el("div", { class: "when" }, esc(b.time)));
        const what = el("div", { class: "what" });
        what.appendChild(el("div", { class: "bt" }, esc(b.title)));
        what.appendChild(el("div", { class: "bd" }, esc(b.detail)));
        if (b.map) {
          what.appendChild(el("a", { class: "map-link", href: mapUrl(b.map), target: "_blank", rel: "noopener" }, esc(UI.openMaps)));
        }
        blk.appendChild(what);
        body.appendChild(blk);
      });

      renderDayMap(body, d, i);

      if (d.eat) body.appendChild(el("div", { class: "eat" }, `🍴 <strong>${esc(UI.eat_label)}:</strong> ${esc(d.eat)}`));
      if (d.tips && d.tips.length) {
        const t = el("div", { class: "tips" }, `💡 <strong>${esc(UI.tips_label)}</strong>`);
        const ul = el("ul");
        d.tips.forEach((tip) => ul.appendChild(el("li", {}, esc(tip))));
        t.appendChild(ul);
        body.appendChild(t);
      }

      day.appendChild(body);
      root.appendChild(day);
    });
  }

  // --- weather ---
  // Map a WMO weather code (Open-Meteo / our normals) to an emoji + label.
  function wxIcon(code) {
    const en = LANG === "en";
    if (code === 0) return { emoji: "☀️", label: en ? "Clear" : "晴" };
    if (code <= 2) return { emoji: "🌤", label: en ? "Mostly sunny" : "晴间多云" };
    if (code === 3) return { emoji: "☁️", label: en ? "Cloudy" : "多云" };
    if (code >= 45 && code <= 48) return { emoji: "🌫", label: en ? "Fog" : "雾" };
    if (code >= 51 && code <= 57) return { emoji: "🌦", label: en ? "Drizzle" : "毛毛雨" };
    if (code >= 61 && code <= 67) return { emoji: "🌧", label: en ? "Rain" : "有雨" };
    if (code >= 71 && code <= 77) return { emoji: "🌨", label: en ? "Snow" : "雪" };
    if (code >= 80 && code <= 82) return { emoji: "🌦", label: en ? "Showers" : "阵雨" };
    if (code >= 95) return { emoji: "⛈", label: en ? "Thunderstorms" : "雷阵雨" };
    return { emoji: "🌡", label: en ? "Mixed" : "多变" };
  }

  // Build the list of trip dates from WEATHER.startDate..endDate (inclusive).
  function weatherDates() {
    const out = [];
    const d = new Date(WEATHER.startDate + "T00:00:00");
    const end = new Date(WEATHER.endDate + "T00:00:00");
    while (d <= end) {
      out.push(d.toISOString().slice(0, 10));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  // Shared weather state: per-date {hi, lo, code, rainChance, live, city}, plus
  // whether any live data arrived and when. The itinerary badges, packing advice,
  // and Weather tab all read from here so they stay in sync.
  const WX = { byDate: {}, anyLive: false, updatedAt: null };

  // Seed WX from seasonal normals (available immediately, works offline).
  // A trip may also ship `WEATHER.byDate` with captured per-day forecast
  // numbers, which take precedence over the city-level normals.
  function seedWeatherNormals() {
    if (typeof WEATHER === "undefined") return;
    weatherDates().forEach((iso) => {
      const city = WEATHER.dayCity[iso];
      const n = (WEATHER.byDate && WEATHER.byDate[iso]) || WEATHER.normals[city] || {};
      WX.byDate[iso] = { hi: n.hi, lo: n.lo, code: n.code, rainChance: n.rainChance, live: false, city };
    });
  }

  // Turn a day's weather into packing advice keys (rain/storm/hot/sun/mild).
  function wxAdviceKeys(w) {
    if (!w) return [];
    const keys = [];
    if (w.code >= 71 && w.code <= 77) keys.push("snow");
    else if (w.code >= 95) keys.push("storm");
    else if ((w.code >= 51 && w.code <= 82) || (w.rainChance != null && w.rainChance >= 40)) keys.push("rain");
    if (w.hi != null && w.hi >= 85) keys.push("hot");
    if (w.lo != null && w.lo <= 38) keys.push("cold");
    if (w.code <= 1 && w.hi != null && w.hi >= 80) keys.push("sun");
    if (!keys.length) keys.push("mild");
    return keys;
  }

  // A tiny inline badge (emoji + hi/lo + optional rain%) for the itinerary header.
  function wxBadge(iso) {
    const w = WX.byDate[iso];
    if (!w || w.hi == null) return null;
    const ic = wxIcon(w.code);
    const badge = el("div", { class: "wx-badge" + (w.live ? " live" : "") });
    badge.title = ic.label + (w.live ? "" : " · " + UI.weather_normal);
    badge.innerHTML =
      `<span class="wxb-emoji">${ic.emoji}</span>` +
      `<span class="wxb-temp">${Math.round(w.hi)}°/${Math.round(w.lo)}°</span>` +
      (w.rainChance != null && w.rainChance >= 30 ? `<span class="wxb-rain">💧${Math.round(w.rainChance)}%</span>` : "");
    return badge;
  }

  // Format the "last updated" time in the active locale.
  function fmtUpdated(d) {
    return d.toLocaleString(locale(), { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  // Render one day's weather row. `data` has {hi, lo, code, rainChance, live}.
  function weatherRow(iso, city, data) {
    const ic = wxIcon(data.code);
    const row = el("div", { class: "wx-row" });
    const tag = data.live
      ? `<span class="wx-tag live">${esc(UI.weather_live)}</span>`
      : `<span class="wx-tag">${esc(UI.weather_normal)}</span>`;
    row.innerHTML =
      `<div class="wx-emoji">${ic.emoji}</div>
       <div class="wx-main">
         <div class="wx-date">${esc(fmtDate(iso))} · ${esc(city)}</div>
         <div class="wx-cond">${esc(ic.label)} ${tag}</div>
       </div>
       <div class="wx-temps">
         <span class="wx-hi">${Math.round(data.hi)}°</span>
         <span class="wx-lo">${Math.round(data.lo)}°</span>
         ${data.rainChance != null ? `<span class="wx-rain">💧${Math.round(data.rainChance)}%</span>` : ""}
       </div>`;
    return row;
  }

  // Render the Weather tab from shared WX state (seeded with normals, possibly
  // upgraded to live), plus a "last updated" line and weather-based packing tips.
  function renderWeather() {
    const root = $("#weather");
    root.innerHTML = "";
    if (typeof WEATHER === "undefined") return;
    const dates = weatherDates();

    const card = el("div", { class: "card" });
    card.appendChild(el("h2", { class: "sec-title" }, "🌦 " + esc(UI.weather_title)));
    card.appendChild(el("p", { class: "sec-sub" }, esc(UI.weather_sub)));

    const list = el("div", { class: "wx-list" });
    dates.forEach((iso) => list.appendChild(weatherRow(iso, cityLabel(WX.byDate[iso].city), WX.byDate[iso])));
    card.appendChild(list);

    // "Last updated" line: live timestamp, or a note that these are averages.
    const updated = el("p", { class: "wx-updated" },
      WX.anyLive && WX.updatedAt ? esc(UI.weather_updated(fmtUpdated(WX.updatedAt))) : esc(UI.weather_updatedNormal));
    card.appendChild(updated);

    const status = el("p", { class: "wx-status" }, WX.anyLive ? "" : esc(UI.weather_loading));
    card.appendChild(status);
    root.appendChild(card);

    // Weather-driven packing advice (deduped across the whole trip window).
    const adviceCard = el("div", { class: "card" });
    adviceCard.appendChild(el("h2", { class: "sec-title" }, "🎒 " + esc(UI.weather_packTitle)));
    const seen = new Set();
    const ul = el("ul", { class: "wx-advice" });
    dates.forEach((iso) => wxAdviceKeys(WX.byDate[iso]).forEach((k) => {
      if (seen.has(k) || !UI.wxAdvice[k]) return; // skip keys a trip's UI dictionary doesn't define
      seen.add(k);
      ul.appendChild(el("li", {}, esc(UI.wxAdvice[k])));
    }));
    adviceCard.appendChild(ul);
    root.appendChild(adviceCard);

    if (!WX.anyLive) fetchLiveWeather();
  }

  // Try Open-Meteo (free, no key). On success, update shared WX state and refresh
  // every weather-dependent view; on failure/offline, the normals already shown stay.
  function fetchLiveWeather() {
    const status = $("#weather .wx-status");
    if (!navigator.onLine) { if (status) status.textContent = UI.weather_offline; return; }

    const dates = weatherDates();
    const cities = Array.from(new Set(dates.map((iso) => WEATHER.dayCity[iso])));
    const reqs = cities.map((city) => {
      const [lat, lon] = WEATHER.coords[city];
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
        `&temperature_unit=fahrenheit&timezone=${encodeURIComponent(WEATHER.timezone || "America/New_York")}` +
        `&start_date=${WEATHER.startDate}&end_date=${WEATHER.endDate}`;
      return fetch(url).then((r) => r.json()).then((j) => ({ city, j }));
    });

    Promise.all(reqs).then((results) => {
      const byCity = {};
      results.forEach(({ city, j }) => { if (j && j.daily && j.daily.time) byCity[city] = j.daily; });

      let liveCount = 0;
      dates.forEach((iso) => {
        const daily = byCity[WEATHER.dayCity[iso]];
        if (!daily) return;
        const di = daily.time.indexOf(iso);
        if (di < 0) return;
        const hi = daily.temperature_2m_max[di], lo = daily.temperature_2m_min[di];
        if (hi == null || lo == null) return;
        WX.byDate[iso] = {
          hi, lo,
          code: daily.weather_code[di],
          rainChance: daily.precipitation_probability_max ? daily.precipitation_probability_max[di] : null,
          live: true, city: WEATHER.dayCity[iso]
        };
        liveCount++;
      });

      if (liveCount > 0) {
        WX.anyLive = true;
        WX.updatedAt = new Date();
        renderWeather();         // redraw tab with live rows + timestamp + advice
        refreshItineraryBadges(); // sync the per-day badges in the Itinerary tab
      } else if (status) {
        status.textContent = UI.weather_offline;
      }
    }).catch(() => { if (status) status.textContent = UI.weather_offline; });
  }

  // Update the small weather badge in each itinerary day header in place.
  function refreshItineraryBadges() {
    document.querySelectorAll(".day-head").forEach((head) => {
      const iso = head.dataset.date;
      if (!iso) return;
      const old = head.querySelector(".wx-badge");
      const fresh = wxBadge(iso);
      if (old && fresh) old.replaceWith(fresh);
      else if (old && !fresh) old.remove();
      else if (!old && fresh) head.querySelector(".dh-main").appendChild(fresh);
    });
  }

  // --- checklists with localStorage (keys are index-based, so state survives language switches) ---
  function checklist(rootSel, storeKey, makeItems) {
    const root = $(rootSel);
    root.innerHTML = "";
    const saved = JSON.parse(localStorage.getItem(storeKey) || "{}");
    const progress = el("div", { class: "progress" });
    const boxes = [];

    const updateProgress = () => { progress.textContent = UI.progress(boxes.filter((b) => b.checked).length, boxes.length); };
    const save = () => {
      const state = {};
      boxes.forEach((b) => (state[b.dataset.key] = b.checked));
      localStorage.setItem(storeKey, JSON.stringify(state));
      updateProgress();
    };

    makeItems(root, (label, key, groupRoot) => {
      const row = el("label", { class: "check" });
      const cb = el("input", { type: "checkbox" });
      cb.dataset.key = key;
      cb.checked = !!saved[key];
      if (cb.checked) row.classList.add("done");
      cb.addEventListener("change", () => { row.classList.toggle("done", cb.checked); save(); });
      row.appendChild(cb);
      row.appendChild(el("span", {}, esc(label)));
      (groupRoot || root).appendChild(row);
      boxes.push(cb);
    });

    root.appendChild(progress);
    const reset = el("button", { class: "reset-btn" }, esc(UI.reset));
    reset.addEventListener("click", () => {
      boxes.forEach((b) => { b.checked = false; b.closest(".check").classList.remove("done"); });
      save();
    });
    root.appendChild(reset);
    updateProgress();
  }

  function renderBookings() {
    checklist("#bookings", STORE + "_bookings", (root, add) => {
      const card = el("div", { class: "card" });
      card.appendChild(el("h2", { class: "sec-title" }, esc(UI.book_title)));
      card.appendChild(el("p", { class: "sec-sub" }, esc(UI.book_sub)));
      root.appendChild(card);
      T.bookings.forEach((b, i) => add(b, "bk" + i, card));
    });
  }

  function renderPacking() {
    checklist("#packing", STORE + "_packing", (root, add) => {
      const card = el("div", { class: "card" });
      card.appendChild(el("h2", { class: "sec-title" }, esc(UI.pack_title)));
      card.appendChild(el("p", { class: "sec-sub" }, esc(UI.pack_sub)));
      root.appendChild(card);
      let gi = 0;
      for (const group in T.packing) {
        const heading = (UI.packGroups && UI.packGroups[group]) || group;
        card.appendChild(el("h3", {}, esc(heading)));
        T.packing[group].forEach((item, j) => add(item, "pk" + gi + "_" + j, card));
        gi++;
      }
    });
  }

  // --- food & nutrition (optional tab; only trips that define TRIP.food) ---
  function renderFood() {
    const root = $("#food");
    if (!root) return;               // East Coast page has no #food section
    root.innerHTML = "";
    if (!T.food) return;
    root.appendChild(el("h2", { class: "sec-title" }, esc(UI.food_title)));
    root.appendChild(el("p", { class: "sec-sub" }, esc(UI.food_sub)));
    T.food.forEach((g) => {
      const card = el("div", { class: "card" });
      card.appendChild(el("h2", { class: "sec-title" }, esc(g.title)));
      if (g.note) card.appendChild(el("p", { class: "sec-sub" }, esc(g.note)));
      const ul = el("ul", { class: "food-list" });
      (g.items || []).forEach((it) => ul.appendChild(el("li", {}, esc(it))));
      card.appendChild(ul);
      root.appendChild(card);
    });
  }

  // --- tabs (listeners attached once; labels refreshed per render) ---
  function setupTabs() {
    const buttons = document.querySelectorAll("nav.tabs button");
    const sections = document.querySelectorAll("main section");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("active"));
        sections.forEach((s) => s.classList.remove("active"));
        btn.classList.add("active");
        $("#" + btn.dataset.target).classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function labelTabs() {
    document.querySelectorAll("nav.tabs button").forEach((btn) => {
      const key = "tab_" + btn.dataset.target;
      if (UI[key]) btn.textContent = UI[key];
    });
  }

  // --- language switch ---
  function setupLangSwitch() {
    document.querySelectorAll("#langSwitch button").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.lang === LANG) return;
        applyLang(btn.dataset.lang, true); // explicit choice — persist it
        renderAll();
      });
    });
  }
  function updateLangButtons() {
    document.querySelectorAll("#langSwitch button").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.lang === LANG);
    });
  }

  // --- render everything (called on boot and on language switch) ---
  function renderAll() {
    // tear down old map instances before rebuilding the DOM
    dayMapRecs.forEach((r) => { if (r && r.map) r.map.remove(); });
    dayMapRecs.length = 0;

    document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
    document.title = T.title + UI.docTitle;
    $("#hero-title").textContent = T.title;
    $("#hero-route").textContent = T.subtitle;
    $("#hero-dates").textContent = UI.heroDates(fmtShort(T.startDate), fmtShort(T.endDate));
    const footer = $("#siteFooter");
    if (footer && UI.footer) footer.textContent = UI.footer;

    labelTabs();
    updateLangButtons();
    renderOverview();
    renderStays();
    renderItinerary();
    renderWeather();
    renderFood();
    renderBookings();
    renderPacking();
    ensureDayMap(0); // first day is open by default
  }

  // --- boot ---
  document.addEventListener("DOMContentLoaded", () => {
    // Default to Chinese; a saved explicit toggle choice still wins.
    const saved = localStorage.getItem("ec2026_lang");
    applyLang(saved || "zh");
    seedWeatherNormals(); // populate WX with averages before first render
    setupTabs();
    setupLangSwitch();
    renderAll();
  });
})();

</script>
</body>
</html>
